[project]
name = "ade-platform"
version = "0.4.2"
description = "ADE sovereign multi-agent platform for digital products, commerce and software automation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "runpod>=1.7,<2",
  "pypdf>=5,<7",
  "Pillow>=10,<13"
  ,"PyMuPDF>=1.24,<2"
  ,"python-docx>=1.1,<2"
  ,"python-pptx>=1.0,<2"
  ,"openpyxl>=3.1,<4"
  ,"reportlab>=4,<5"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
browser = ["browser-use>=0.11,<1", "playwright>=1.50,<2"]
documents = ["python-pptx>=1.0,<2", "reportlab>=4,<5"]
build = ["pyinstaller>=6,<7", "nuitka>=2,<3"]

[project.scripts]
ade = "ade.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ade*"]
